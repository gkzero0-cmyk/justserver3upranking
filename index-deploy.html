</style></head><body><aside class="side"><div class="brand">그냥서버 <b>적자생존</b></div><nav class="nav"><a href="#ranking">🏆 실시간 UP 랭킹</a><a href="#comments">💬 전체 댓글</a><a id="sideSource" target="_blank">↗ 원본 게시글</a></nav><button class="theme" id="theme">◐ 테마 변경</button></aside><div class="page"><main class="wrap"><section class="hero" id="ranking"><div><div class="live">● LIVE</div><h1>그냥서버 : 적자생존<br><em>실시간 UP 랭킹</em></h1><p>SOOP 게시글 댓글의 UP 수를 자동으로 반영합니다.</p></div><div class="actions"><a class="btn" id="source" target="_blank">원본 게시글 ↗</a> <button id="refresh">새로고침</button></div></section><section class="stats"><div class="stat"><span>전체 댓글</span><strong id="total">—</strong><small id="change">불러오는 중</small></div><div class="stat"><span>현재 1위</span><strong><b id="topup">—</b> UP</strong><small id="topname">—</small></div><div class="stat"><span>자동 갱신</span><strong><b id="ival">5</b>초</strong><small id="updated">대기 중</small></div><div class="stat"><span>연결 상태</span><strong id="status">연결 중</strong><small>SOOP 댓글 API</small></div></section><section class="panel"><div class="head"><h2>실시간 TOP 3</h2></div><div class="podium" id="podium"></div></section><section class="panel" id="comments"><div class="head"><h2>전체 UP 랭킹</h2><div class="filters"><input id="search" placeholder="닉네임 또는 댓글 검색"><select id="sort"><option value="up">UP 높은순</option><option value="new">최신순</option><option value="old">오래된순</option></select><select id="interval"><option>3</option><option selected>5</option><option>10</option><option>30</option></select></div></div><div id="error" class="error hidden"></div><div class="rows" id="list"></div></section></main></div><script>
const S={channel:'chunbongtv',post:'204274449',comments:[],prev:new Map(),sort:'up',q:'',ival:5,timer:0,loading:false},$=s=>document.querySelector(s),E={total:$('#total'),change:$('#change'),topup:$('#topup'),topname:$('#topname'),ival:$('#ival'),updated:$('#updated'),status:$('#status'),podium:$('#podium'),list:$('#list'),error:$('#error'),refresh:$('#refresh'),search:$('#search'),sort:$('#sort'),interval:$('#interval'),source:$('#source'),sideSource:$('#sideSource')};const esc=(v='')=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),num=v=>new Intl.NumberFormat('ko-KR').format(+v||0),date=v=>{let t=new Date(String(v||'').replace(' ','T')).getTime();return Number.isFinite(t)?t:0},key=c=>c.id||`${c.userId}|${c.date}|${c.content}`;function station(c){return c.stationUrl||c.userId&&`https://www.sooplive.com/station/${encodeURIComponent(c.userId)}`||''}function avatar(c){let id=String(c.userId||'').toLowerCase(),u=station(c);if(!id||!u)return'<span class="avatar">●</span>';let b=id.slice(0,2),base=`https://stimg.sooplive.com/LOGO/${b}/${id}/${id}`,label=`${c.nickname||id} 방송국으로 이동`;return `<a class="avatar" href="${esc(u)}" target="_blank" title="${esc(label)}"><img src="${base}.jpg" data-f="${base}.webp" alt="" onerror="if(this.dataset.f){this.src=this.dataset.f;this.dataset.f=''}else{this.remove();this.parentNode.textContent='●'}"></a>`}function rel(v){let t=date(v);if(!t)return v||'';let m=Math.floor((Date.now()-t)/60000);if(m<1)return'방금 전';if(m<60)return m+'분 전';let h=Math.floor(m/60);if(h<24)return h+'시간 전';return Math.floor(h/24)+'일 전'}function sorted(){let q=S.q.toLowerCase(),a=S.comments.filter(c=>!q||`${c.nickname} ${c.userId} ${c.content}`.toLowerCase().includes(q));return a.sort(S.sort==='up'?(a,b)=>b.up-a.up||date(a.date)-date(b.date):S.sort==='new'?(a,b)=>date(b.date)-date(a.date):(a,b)=>date(a.date)-date(b.date))}function renderPodium(){let a=[...S.comments].sort((x,y)=>y.up-x.up||date(x.date)-date(y.date)).slice(0,3),med=['🥇','🥈','🥉'];E.podium.innerHTML=a.length?a.map((c,i)=>`<article class="pc"><div>${med[i]} RANK ${i+1}</div><div class="name">${esc(c.nickname)}</div><div class="up">${num(c.up)} UP</div><p>${esc(c.content||'(내용 없음)')}</p></article>`).join(''):'<div>표시할 댓글이 없습니다.</div>'}function renderList(){let a=sorted();E.list.innerHTML=a.length?a.map((c,i)=>`<article class="row"><div class="rank">${i+1}</div><div><div class="authorline">${avatar(c)}<a class="author" href="${esc(station(c)||c.link)}" target="_blank">${esc(c.nickname)}</a><span class="time">${esc(rel(c.date))}</span></div><div class="comment">${esc(c.content||'(내용 없음)')}</div></div><div class="up">${num(c.up)} UP</div><a class="open" href="${esc(c.link)}" target="_blank">보기 ↗</a></article>`).join(''):'<div style="padding:40px;text-align:center">검색 결과가 없습니다.</div>'}async function load(){if(S.loading)return;S.loading=true;E.status.textContent='갱신 중';try{let r=await fetch(`/api/comments?channel=${S.channel}&post=${S.post}`,{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||r.status);let next=new Map(d.comments.map(c=>[key(c),c])),nw=0,ch=0;for(let[k,c]of next){let o=S.prev.get(k);if(!o)nw++;else if(+o.up!==+c.up)ch++}S.comments=d.comments;S.prev=next;E.total.textContent=num(S.comments.length);let top=[...S.comments].sort((a,b)=>b.up-a.up)[0];E.topup.textContent=top?num(top.up):0;E.topname.textContent=top?.nickname||'—';E.change.textContent=nw?`새 댓글 +${nw}`:ch?`UP 변동 ${ch}건`:'변동 없음';E.updated.textContent=new Date().toLocaleTimeString('ko-KR')+' 갱신';E.status.textContent='정상 연결';E.source.href=E.sideSource.href=d.postUrl;renderPodium();renderList();E.error.classList.add('hidden')}catch(e){E.status.textContent='연결 오류';E.error.textContent='댓글 데이터를 불러오지 못했습니다: '+e.message;E.error.classList.remove('hidden')}finally{S.loading=false}}function restart(){clearInterval(S.timer);S.timer=setInterval(load,S.ival*1000)}E.refresh.onclick=load;E.search.oninput=e=>{S.q=e.target.value;renderList()};E.sort.onchange=e=>{S.sort=e.target.value;renderList()};E.interval.onchange=e=>{S.ival=+e.target.value;E.ival.textContent=S.ival;restart()};$('#theme').onclick=()=>{let d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark'};let src=`https://www.sooplive.com/station/${S.channel}/post/${S.post}`;E.source.href=E.sideSource.href=src;load();restart();
