name: low-soop-favorites-test

on:
  push:
    branches:
      - feature/low-soop-favorites-filter

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: justserver-up-ranking-github-ready
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply filter-handoff fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ranking-utils.js')
          source = path.read_text(encoding='utf-8')
          if 'suppressLowFilterReset' in source:
              raise SystemExit(0)

          start = source.index('  function installLowSoopFavoriteUi(root) {')
          end = source.index('\n  function installNewApplicantUi(root) {', start)
          block = source[start:end]

          block = block.replace(
              '  let scheduled = false;\n',
              '  let scheduled = false;\n  let suppressLowFilterReset = false;\n',
              1,
          )

          old = '''    if (filterActive) {
                for (const id of ['favoriteFilterBtn', 'chzzkFilterBtn']) {
                  const other = doc.getElementById(id);
                  if (other?.getAttribute('aria-pressed') === 'true') other.click();
                }
                const newBadge = doc.getElementById('newApplicantCount')?.closest('.new-applicant-badge');
                if (newBadge?.getAttribute('aria-pressed') === 'true') newBadge.click();
                const search = doc.getElementById('searchInput');
                if (search?.value) {
                  search.value = '';
                  search.dispatchEvent(new root.Event('input', { bubbles: true }));
                }
              }
'''
          # Product code is intentionally less indented than the source template above.
          compact_old = '''    if (filterActive) {
      for (const id of ['favoriteFilterBtn', 'chzzkFilterBtn']) {
        const other = doc.getElementById(id);
        if (other?.getAttribute('aria-pressed') === 'true') other.click();
      }
      const newBadge = doc.getElementById('newApplicantCount')?.closest('.new-applicant-badge');
      if (newBadge?.getAttribute('aria-pressed') === 'true') newBadge.click();
      const search = doc.getElementById('searchInput');
      if (search?.value) {
        search.value = '';
        search.dispatchEvent(new root.Event('input', { bubbles: true }));
      }
    }
'''
          replacement = '''    if (filterActive) {
      suppressLowFilterReset = true;
      try {
        for (const id of ['favoriteFilterBtn', 'chzzkFilterBtn']) {
          const other = doc.getElementById(id);
          if (other?.getAttribute('aria-pressed') === 'true') other.click();
        }
        const newBadge = doc.getElementById('newApplicantCount')?.closest('.new-applicant-badge');
        if (newBadge?.getAttribute('aria-pressed') === 'true') newBadge.click();
        const search = doc.getElementById('searchInput');
        if (search?.value) {
          search.value = '';
          search.dispatchEvent(new root.Event('input', { bubbles: true }));
        }
      } finally {
        suppressLowFilterReset = false;
      }
    }
'''
          if compact_old not in block:
              raise SystemExit('setFilter block not found')
          block = block.replace(compact_old, replacement, 1)
          block = block.replace(
              '      if (!filterActive) return;\n',
              '      if (suppressLowFilterReset || !filterActive) return;\n'
          )

          source = source[:start] + block + source[end:]
          path.write_text(source, encoding='utf-8')
          PY
      - run: npm test
      - run: node --check ranking-utils.js
      - name: Commit passing fix
        shell: bash
        run: |
          if ! git diff --quiet -- ranking-utils.js; then
            git config user.name "gkzero0-cmyk"
            git config user.email "gkzero0@gmail.com"
            git add ranking-utils.js
            git commit -m "fix: preserve low-SOOP filter during handoff"
            git push origin HEAD:feature/low-soop-favorites-filter
          fi
