name: low-soop-favorites-test

on:
  push:
    branches:
      - feature/low-soop-favorites-filter

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: justserver-up-ranking-github-ready
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply filter-handoff fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ranking-utils.js')
          source = path.read_text(encoding='utf-8')
          if 'suppressLowFilterReset' not in source:
              start = source.index('  function installLowSoopFavoriteUi(root) {')
              end = source.index('\n  function installNewApplicantUi(root) {', start)
              block = source[start:end]
              block = block.replace('  let scheduled = false;\n', '  let scheduled = false;\n  let suppressLowFilterReset = false;\n', 1)
              block = block.replace('    if (filterActive) {\n      for (const id of', '    if (filterActive) {\n      suppressLowFilterReset = true;\n      for (const id of', 1)
              block = block.replace("      }\n    }\n    scheduleApply();\n  }\n\n  button.addEventListener", "      }\n      suppressLowFilterReset = false;\n    }\n    scheduleApply();\n  }\n\n  button.addEventListener", 1)
              block = block.replace('      if (!filterActive) return;\n', '      if (suppressLowFilterReset || !filterActive) return;\n')
              source = source[:start] + block + source[end:]
              path.write_text(source, encoding='utf-8')
          PY
      - run: npm test
      - run: node --check ranking-utils.js
      - name: Commit passing fix
        shell: bash
        run: |
          if ! git diff --quiet -- ranking-utils.js; then
            git config user.name "gkzero0-cmyk"
            git config user.email "gkzero0@gmail.com"
            git add ranking-utils.js
            git commit -m "fix: preserve low-SOOP filter during handoff"
            git push origin HEAD:feature/low-soop-favorites-filter
          fi
