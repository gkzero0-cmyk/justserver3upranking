# committed-tree verification
name: low-soop-favorites-test

on:
  push:
    branches:
      - feature/low-soop-favorites-filter

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: justserver-up-ranking-github-ready
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply feature implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ranking-utils.js')
          source = path.read_text(encoding='utf-8')
          if 'function extractSoopFavoriteCount' in source:
              raise SystemExit(0)
          raise SystemExit('committed feature implementation missing')
          PY
      - run: npm test
      - run: node --check ranking-utils.js
