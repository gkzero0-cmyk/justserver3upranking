name: low-soop-favorites-test

on:
  push:
    branches:
      - feature/low-soop-favorites-filter

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: justserver-up-ranking-github-ready
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply feature implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ranking-utils.js')
          source = path.read_text(encoding='utf-8')
          if 'function extractSoopFavoriteCount' in source:
              raise SystemExit(0)

          source = source.replace(
              "      api.installNewApplicantUi(root);\n",
              "      api.installNewApplicantUi(root);\n      api.installLowSoopFavoriteUi(root);\n",
              1,
          )

          chzzk_block = '''  function countChzzkApplicants(comments) {
            const applicants = new Set();
            for (const item of comments || []) {
              if (!isChzzkApplicant(item)) continue;
              const userId = String(item?.userId || '').trim();
              applicants.add(userId ? `user:${userId}` : favoriteKey(item));
            }
            return applicants.size;
          }

          '''
          if chzzk_block not in source:
              raise SystemExit('countChzzkApplicants block not found')

          low_helpers = r'''  function normalizeSoopCountToken(value) {
            const raw = String(value ?? '').replace(/\s+/g, '');
            if (!raw) return null;
            const unit = raw.match(/([0-9]+(?:\.[0-9]+)?)(만|천)(?:\+([0-9,]+))?/);
            if (unit) {
              const base = Number(unit[1]) * (unit[2] === '만' ? 10000 : 1000);
              const plus = unit[3] ? Number(unit[3].replace(/,/g, '')) : 0;
              const total = base + plus;
              return Number.isFinite(total) ? Math.round(total) : null;
            }
            const plain = raw.match(/[0-9][0-9,]*/);
            if (!plain) return null;
            const number = Number(plain[0].replace(/,/g, ''));
            return Number.isFinite(number) ? number : null;
          }

          function extractSoopFavoriteCount(item) {
            const text = String(item?.comment || '')
              .replace(/<br\s*\/?\s*>/gi, '\n')
              .replace(/<[^>]+>/g, '')
              .trim();
            if (!text) return null;

            const platformPattern = /(?:SOOP|숲|아프리카(?:TV)?)/i;
            const chzzkPattern = /(?:치지직|옆동네)/i;
            const fanLabelSource = '(?:애청자(?:\\s*수)?|즐겨찾기(?:\\s*수)?|즐찾(?:\\s*수)?|팔로워(?:\\s*수)?|팔로우\\s*수|팬(?:\\s*수)?)';
            const countSource = '([0-9][0-9,]*(?:\\.[0-9]+)?\\s*(?:만|천)?(?:\\s*\\+\\s*[0-9,]+)?)';
            const segments = text.split(/\r?\n|\/|\|/).map(value => value.trim()).filter(Boolean);
            const explicitSoop = new RegExp(`(?:SOOP|숲|아프리카(?:TV)?)(?:\\s*${fanLabelSource})?\\s*[:：-]?\\s*${countSource}`, 'i');
            const labeledCount = new RegExp(`${fanLabelSource}\\s*[:：-]?\\s*${countSource}`, 'i');

            for (const segment of segments) {
              if (!platformPattern.test(segment)) continue;
              const explicit = segment.match(explicitSoop);
              if (explicit) return normalizeSoopCountToken(explicit[1]);
              const labeled = segment.match(labeledCount);
              if (labeled) return normalizeSoopCountToken(labeled[1]);
            }

            for (const segment of segments) {
              if (chzzkPattern.test(segment) && !platformPattern.test(segment)) continue;
              const labeled = segment.match(labeledCount);
              if (labeled) return normalizeSoopCountToken(labeled[1]);
            }

            const slashParts = text.split(/\s*\/\s*/).map(value => value.trim()).filter(Boolean);
            if (slashParts.length >= 2 && !chzzkPattern.test(slashParts[1])) {
              const second = slashParts[1].replace(/^[^\p{L}\p{N}]+/u, '').trim();
              const pureCount = second.match(new RegExp(`^${countSource}\\s*명?\\s*$`, 'i'));
              if (pureCount) return normalizeSoopCountToken(pureCount[1]);
            }

            const lines = text.split(/\r?\n/)
              .map(value => value.trim())
              .filter(Boolean)
              .map(value => value.replace(/^[^\p{L}\p{N}]+/u, '').trim());
            if (lines.length >= 2 && !chzzkPattern.test(lines[1])) {
              const secondLineCount = lines[1].match(new RegExp(`^${countSource}\\s*명?\\s*$`, 'i'));
              if (secondLineCount) return normalizeSoopCountToken(secondLineCount[1]);
            }

            return null;
          }

          function isLowSoopFavoriteApplicant(item, limit = 500) {
            const max = Number(limit);
            const count = extractSoopFavoriteCount(item);
            return Number.isFinite(max) && max >= 0 && count !== null && count <= max;
          }

          function countLowSoopFavoriteApplicants(comments, limit = 500) {
            const applicants = new Set();
            for (const item of comments || []) {
              if (!isLowSoopFavoriteApplicant(item, limit)) continue;
              const userId = String(item?.userId || '').trim();
              applicants.add(userId ? `user:${userId}` : favoriteKey(item));
            }
            return applicants.size;
          }

          '''
          source = source.replace(chzzk_block, chzzk_block + low_helpers, 1)

          new_ui_marker = '  function installNewApplicantUi(root) {\n'
          if new_ui_marker not in source:
              raise SystemExit('installNewApplicantUi marker not found')

          low_ui = r'''  function installLowSoopFavoriteUi(root) {
            const doc = root?.document;
            if (!doc || root.__justserverLowSoopFavoriteUiInstalled) return;
            const stats = doc.querySelector('.stats');
            const tabs = doc.querySelector('.sort-tabs');
            if (!stats || !tabs) return;
            root.__justserverLowSoopFavoriteUiInstalled = true;

            const style = doc.createElement('style');
            style.id = 'low-soop-favorite-ui-style';
            style.textContent = `
              .stats{grid-template-columns:repeat(6,1fr)}
              .low-soop-filter-btn{height:34px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:#8390a5;font-size:12px;font-weight:850;cursor:pointer;white-space:nowrap}
              .low-soop-filter-btn:hover{color:#dbe4f6;background:#151b27}
              .low-soop-filter-btn.active{background:#3b2818;color:#ffd8a1;box-shadow:inset 0 0 0 1px #805b31}
              #tbody.low-soop-filter-active tr[data-rank][data-low-soop="0"]{display:none}
              #tbody.low-soop-filter-active .cut-row{display:none}
              @media(max-width:820px){.stats{grid-template-columns:repeat(2,1fr)}.low-soop-filter-btn{flex:1}}
            `;
            (doc.head || doc.documentElement).appendChild(style);

            const countStat = doc.createElement('div');
            countStat.className = 'stat';
            countStat.innerHTML = '<div class="k">SOOP 즐겨찾기 500 이하</div><div class="v" id="lowSoopFavoriteCount">-</div>';
            const autoRefreshStat = [...stats.children].find(node => String(node.textContent || '').includes('자동 갱신')) || null;
            stats.insertBefore(countStat, autoRefreshStat);

            const button = doc.createElement('button');
            button.className = 'low-soop-filter-btn';
            button.id = 'lowSoopFavoriteFilterBtn';
            button.type = 'button';
            button.setAttribute('aria-pressed', 'false');
            button.textContent = '500 이하';
            const chzzkButton = doc.getElementById('chzzkFilterBtn');
            if (chzzkButton) chzzkButton.insertAdjacentElement('afterend', button);
            else tabs.appendChild(button);

            const countNode = doc.getElementById('lowSoopFavoriteCount');
            const tbody = doc.getElementById('tbody');
            let lowUsers = new Set();
            let lowKeys = new Set();
            let filterActive = false;
            let dataReady = false;
            let scheduled = false;

            function setData(comments) {
              lowUsers = new Set();
              lowKeys = new Set();
              for (const item of comments || []) {
                if (!isLowSoopFavoriteApplicant(item)) continue;
                const userId = String(item?.userId || '').trim();
                if (userId) lowUsers.add(userId);
                lowKeys.add(favoriteKey(item));
              }
              dataReady = true;
              if (countNode) countNode.textContent = `${countLowSoopFavoriteApplicants(comments)}명`;
              scheduleApply();
            }

            function rowMatches(row) {
              const favoriteButton = row.querySelector('.favorite-btn[data-favorite-key]');
              const key = favoriteButton?.getAttribute('data-favorite-key') || '';
              const detail = row.querySelector('[data-detail-user]');
              const userId = detail?.getAttribute('data-detail-user') || '';
              return Boolean((key && lowKeys.has(key)) || (userId && lowUsers.has(userId)));
            }

            function apply() {
              scheduled = false;
              button.classList.toggle('active', filterActive);
              button.setAttribute('aria-pressed', filterActive ? 'true' : 'false');
              if (!tbody) return;
              const rows = [...tbody.querySelectorAll('tr[data-rank]')];
              let matching = 0;
              for (const row of rows) {
                const isLow = rowMatches(row);
                row.setAttribute('data-low-soop', isLow ? '1' : '0');
                if (isLow) matching += 1;
              }
              tbody.classList.toggle('low-soop-filter-active', filterActive);

              let emptyRow = tbody.querySelector('tr[data-low-soop-empty="1"]');
              if (filterActive && dataReady && matching === 0) {
                const existingEmpty = tbody.querySelector('.empty');
                if (existingEmpty) {
                  existingEmpty.textContent = 'SOOP 즐겨찾기 500명 이하 신청자가 없습니다.';
                } else if (!emptyRow) {
                  emptyRow = doc.createElement('tr');
                  emptyRow.setAttribute('data-low-soop-empty', '1');
                  emptyRow.innerHTML = '<td colspan="6"><div class="empty">SOOP 즐겨찾기 500명 이하 신청자가 없습니다.</div></td>';
                  tbody.appendChild(emptyRow);
                }
              } else if (emptyRow) {
                emptyRow.remove();
              }
            }

            function scheduleApply() {
              if (scheduled) return;
              scheduled = true;
              (root.requestAnimationFrame || root.setTimeout)(apply, 0);
            }

            function setFilter(next) {
              filterActive = Boolean(next);
              if (filterActive) {
                for (const id of ['favoriteFilterBtn', 'chzzkFilterBtn']) {
                  const other = doc.getElementById(id);
                  if (other?.getAttribute('aria-pressed') === 'true') other.click();
                }
                const newBadge = doc.getElementById('newApplicantCount')?.closest('.new-applicant-badge');
                if (newBadge?.getAttribute('aria-pressed') === 'true') newBadge.click();
                const search = doc.getElementById('searchInput');
                if (search?.value) {
                  search.value = '';
                  search.dispatchEvent(new root.Event('input', { bubbles: true }));
                }
              }
              scheduleApply();
            }

            button.addEventListener('click', () => setFilter(!filterActive));
            for (const id of ['favoriteFilterBtn', 'chzzkFilterBtn']) {
              doc.getElementById(id)?.addEventListener('click', () => {
                if (!filterActive) return;
                filterActive = false;
                scheduleApply();
              });
            }
            doc.getElementById('newApplicantCount')?.closest('.new-applicant-badge')?.addEventListener('click', () => {
              if (!filterActive) return;
              filterActive = false;
              scheduleApply();
            });

            if (tbody && root.MutationObserver) {
              new root.MutationObserver(scheduleApply).observe(tbody, { childList: true, subtree: true });
            }

            const originalFetch = root.fetch;
            if (typeof originalFetch === 'function') {
              root.fetch = async function (...args) {
                const response = await originalFetch.apply(this, args);
                try {
                  const request = args[0];
                  const requestUrl = typeof request === 'string' ? request : request?.url || '';
                  if (String(requestUrl).includes('/api/comments')) {
                    response.clone().json().then(data => {
                      if (!Array.isArray(data?.comments)) return;
                      setData(data.comments);
                    }).catch(() => {});
                  }
                } catch {}
                return response;
              };
            }

            scheduleApply();
          }

          '''
          source = source.replace(new_ui_marker, low_ui + new_ui_marker, 1)

          source = source.replace(
              '    isChzzkApplicant,\n    countChzzkApplicants,\n',
              '    isChzzkApplicant,\n    countChzzkApplicants,\n    extractSoopFavoriteCount,\n    isLowSoopFavoriteApplicant,\n    countLowSoopFavoriteApplicants,\n',
              1,
          )
          source = source.replace(
              '    installApplicantDetailEnhancements,\n    installNewApplicantUi\n',
              '    installApplicantDetailEnhancements,\n    installNewApplicantUi,\n    installLowSoopFavoriteUi\n',
              1,
          )

          path.write_text(source, encoding='utf-8')
          PY
      - run: npm test
      - run: node --check ranking-utils.js
      - name: Commit passing implementation
        shell: bash
        run: |
          if ! git diff --quiet -- ranking-utils.js; then
            git config user.name "gkzero0-cmyk"
            git config user.email "gkzero0@gmail.com"
            git add ranking-utils.js
            git commit -m "feat: add SOOP 500-or-less applicant filter"
            git push origin HEAD:feature/low-soop-favorites-filter
          fi
