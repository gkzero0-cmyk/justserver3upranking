name: Dero Chzzk Detail Test
on:
  push:
    branches:
      - fix/dero-chzzk-detail
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: justserver-up-ranking-github-ready
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/dero-chzzk-detail.test.js
