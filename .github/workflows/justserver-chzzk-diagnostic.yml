name: JustServer CHZZK Detail Diagnostic

on:
  push:
    branches:
      - verify/prod-smoke-20260915

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save puppeteer-core@24.16.0
      - run: node .github/scripts/justserver-chzzk-diagnostic.cjs
