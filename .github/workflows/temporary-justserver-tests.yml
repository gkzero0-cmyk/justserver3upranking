name: Temporary JustServer Tests

on:
  push:
    branches:
      - fix/server-schedule-sept16

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: justserver-up-ranking-github-ready
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: node --check ranking-utils.js
      - run: node --check applicant-detail-utils.js
      - run: node --check api/applicant-detail.js
