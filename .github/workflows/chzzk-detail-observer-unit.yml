name: CHZZK Detail Observer Regression

on:
  push:
    branches:
      - verify/prod-smoke-20260915

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run full regression suite
        working-directory: justserver-up-ranking-github-ready
        run: npm test
