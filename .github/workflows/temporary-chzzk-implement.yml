name: Temporary Chzzk Implementation

on:
  push:
    branches:
      - feature/chzzk-filter-card

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chzzk-filter-card
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply implementation if needed
        shell: python
        run: |
          from pathlib import Path

          root = Path('justserver-up-ranking-github-ready')
          util_path = root / 'ranking-utils.js'
          index_path = root / 'index.html'
          util = util_path.read_text(encoding='utf-8')
          index = index_path.read_text(encoding='utf-8')

          if 'function isChzzkApplicant' not in util:
              marker = """  function toggleFavoriteId(ids, id) {\n    const key = String(id || '').trim();\n    const set = new Set((ids || []).map(x => String(x || '').trim()).filter(Boolean));\n    if (!key) return [...set];\n    if (set.has(key)) set.delete(key); else set.add(key);\n    return [...set];\n  }\n"""
              addition = marker + """\n  function isChzzkApplicant(item) {\n    const comment = String(item?.comment || '').trim();\n    return comment.includes('치지직') || comment.includes('옆동네');\n  }\n\n  function countChzzkApplicants(comments) {\n    const applicants = new Set();\n    for (const item of comments || []) {\n      if (!isChzzkApplicant(item)) continue;\n      const userId = String(item?.userId || '').trim();\n      applicants.add(userId ? `user:${userId}` : favoriteKey(item));\n    }\n    return applicants.size;\n  }\n"""
              if marker not in util:
                  raise SystemExit('toggleFavoriteId marker not found')
              util = util.replace(marker, addition, 1)
              export_marker = """    readFavoriteIds,\n    toggleFavoriteId,\n    serverScheduleMarkup,"""
              export_replacement = """    readFavoriteIds,\n    toggleFavoriteId,\n    isChzzkApplicant,\n    countChzzkApplicants,\n    serverScheduleMarkup,"""
              if export_marker not in util:
                  raise SystemExit('export marker not found')
              util = util.replace(export_marker, export_replacement, 1)
              util_path.write_text(util, encoding='utf-8')

          if 'id="chzzkCount"' not in index:
              replacements = [
                  ('.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}', '.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}'),
                  ('.sort-btn,.favorite-filter-btn{height:34px;', '.sort-btn,.favorite-filter-btn,.chzzk-filter-btn{height:34px;'),
                  ('.sort-btn:hover,.favorite-filter-btn:hover{', '.sort-btn:hover,.favorite-filter-btn:hover,.chzzk-filter-btn:hover{'),
                  ('.sort-btn.active,.favorite-filter-btn.active{', '.sort-btn.active,.favorite-filter-btn.active,.chzzk-filter-btn.active{'),
                  ('.favorite-filter-btn.active{background:#4a3a18;box-shadow:inset 0 0 0 1px #78612b;color:#ffe7a0}', '.favorite-filter-btn.active{background:#4a3a18;box-shadow:inset 0 0 0 1px #78612b;color:#ffe7a0}.chzzk-filter-btn.active{background:#183b35;box-shadow:inset 0 0 0 1px #2e7569;color:#9af5e5}'),
                  ('.sort-btn,.favorite-filter-btn{flex:1}', '.sort-btn,.favorite-filter-btn,.chzzk-filter-btn{flex:1}'),
                  ('<div class="stat"><div class="k">100위 커트라인</div><div class="v" id="cutUp">-</div></div>\n      <div class="stat"><div class="k">자동 갱신</div><div class="v">1초</div></div>', '<div class="stat"><div class="k">100위 커트라인</div><div class="v" id="cutUp">-</div></div>\n      <div class="stat"><div class="k">치지직 신청자</div><div class="v" id="chzzkCount">-</div></div>\n      <div class="stat"><div class="k">자동 갱신</div><div class="v">1초</div></div>'),
                  ('<button class="favorite-filter-btn" id="favoriteFilterBtn" type="button" aria-pressed="false">★ 즐겨찾기 0</button>', '<button class="favorite-filter-btn" id="favoriteFilterBtn" type="button" aria-pressed="false">★ 즐겨찾기 0</button>\n          <button class="chzzk-filter-btn" id="chzzkFilterBtn" type="button" aria-pressed="false">치지직</button>'),
                  ('countKstToday, readFavoriteIds, toggleFavoriteId,\n    serializeMap, readRankMap, readRankChangeHistory, updateRankChangeHistory', 'countKstToday, readFavoriteIds, toggleFavoriteId,\n    isChzzkApplicant, countChzzkApplicants,\n    serializeMap, readRankMap, readRankChangeHistory, updateRankChangeHistory'),
                  ('topUp: document.getElementById(\'topUp\'), cutUp: document.getElementById(\'cutUp\'),\n    newApplicant:', 'topUp: document.getElementById(\'topUp\'), cutUp: document.getElementById(\'cutUp\'),\n    chzzkCount: document.getElementById(\'chzzkCount\'), newApplicant:'),
                  ('favoriteFilter: document.getElementById(\'favoriteFilterBtn\'),\n    sortButtons:', 'favoriteFilter: document.getElementById(\'favoriteFilterBtn\'),\n    chzzkFilter: document.getElementById(\'chzzkFilterBtn\'),\n    sortButtons:'),
                  ('let favoritesOnly = false;\n  let favoriteIds', 'let favoritesOnly = false;\n  let chzzkOnly = false;\n  let favoriteIds'),
                  ('if (favoritesOnly && !favorites.has(favoriteKey(x))) return false;\n      if (!q) return true;', 'if (favoritesOnly && !favorites.has(favoriteKey(x))) return false;\n      if (chzzkOnly && !isChzzkApplicant(x)) return false;\n      if (!q) return true;'),
                  ('els.cutUp.textContent = ranked.length >= 100 ? fmt.format(ranked[99].up||0) : \'-\';\n    els.newApplicant', 'els.cutUp.textContent = ranked.length >= 100 ? fmt.format(ranked[99].up||0) : \'-\';\n    els.chzzkCount.textContent = `${fmt.format(countChzzkApplicants(all))}명`;\n    els.newApplicant'),
                  ("els.favoriteFilter.setAttribute('aria-pressed', favoritesOnly ? 'true' : 'false');", "els.favoriteFilter.setAttribute('aria-pressed', favoritesOnly ? 'true' : 'false');\n    els.chzzkFilter.classList.toggle('active', chzzkOnly);\n    els.chzzkFilter.setAttribute('aria-pressed', chzzkOnly ? 'true' : 'false');"),
                  ("const message = favoritesOnly ? '즐겨찾기한 신청자가 없습니다.' : '표시할 댓글이 없습니다.';", "const message = chzzkOnly ? '치지직 또는 옆동네로 분류된 신청자가 없습니다.' : favoritesOnly ? '즐겨찾기한 신청자가 없습니다.' : '표시할 댓글이 없습니다.';"),
                  ("if (!q && !favoritesOnly && sortMode === 'up' && x.rank === 101)", "if (!q && !favoritesOnly && !chzzkOnly && sortMode === 'up' && x.rank === 101)"),
                  ("els.favoriteFilter.addEventListener('click', () => {\n    favoritesOnly = !favoritesOnly;\n    render();\n  });", "els.favoriteFilter.addEventListener('click', () => {\n    favoritesOnly = !favoritesOnly;\n    render();\n  });\n  els.chzzkFilter.addEventListener('click', () => {\n    chzzkOnly = !chzzkOnly;\n    render();\n  });")
              ]
              for old, new in replacements:
                  if old not in index:
                      raise SystemExit(f'index marker not found: {old[:80]}')
                  index = index.replace(old, new, 1)
              index_path.write_text(index, encoding='utf-8')
      - name: Run tests
        working-directory: justserver-up-ranking-github-ready
        run: |
          npm test
          node --check ranking-utils.js
      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git config user.name "gkzero0-cmyk"
          git config user.email "gkzero0@gmail.com"
          git add justserver-up-ranking-github-ready/ranking-utils.js justserver-up-ranking-github-ready/index.html
          git commit -m "feat: add Chzzk applicant filter and count"
          git push origin HEAD:feature/chzzk-filter-card
