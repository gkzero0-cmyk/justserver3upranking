<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="그냥서버 : 적자생존 실시간 UP 랭킹" />
  <meta name="theme-color" content="#080b12" />
  <title>그냥서버 : 적자생존 실시간 UP 랭킹</title>
  <style>
    :root{
      --bg:#070910; --panel:#10141e; --panel2:#151b27; --line:#232b3b;
      --text:#f4f7fb; --muted:#8d98aa; --brand:#7a97ff; --brand2:#5f7eff;
      --hot:#ff5e78; --gold:#ffc857; --green:#5dd6a6;
    }
    *{box-sizing:border-box}
    html{color-scheme:dark}
    body{margin:0;background:
      radial-gradient(900px 440px at 50% -120px,rgba(104,132,255,.18),transparent 70%),
      var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}
    a{color:inherit;text-decoration:none}
    button,input,select{font:inherit}
    .wrap{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:36px 0 80px}
    .hero{padding:28px 28px 24px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(18,23,35,.96),rgba(11,14,22,.96));box-shadow:0 20px 60px rgba(0,0,0,.28)}
    .eyebrow{display:flex;align-items:center;gap:9px;color:#b9c5ff;font-size:13px;font-weight:800;letter-spacing:.02em}
    .live-dot{width:8px;height:8px;border-radius:50%;background:#6df1af;box-shadow:0 0 0 5px rgba(109,241,175,.1);animation:pulse 1.7s infinite}
    @keyframes pulse{50%{opacity:.45}}
    h1{margin:12px 0 8px;font-size:clamp(25px,4vw,40px);letter-spacing:-.045em;line-height:1.15}
    .sub{margin:0;color:var(--muted);font-size:14px;line-height:1.7}
    .hero-actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
    .btn{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#151a25;color:#eaf0ff;font-weight:750;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
    .btn:hover{border-color:#3a4661;background:#1a2130}.btn.primary{background:var(--brand2);border-color:transparent;color:#fff}.btn.primary:hover{filter:brightness(1.06)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
    .stat{padding:16px 18px;border:1px solid var(--line);border-radius:15px;background:var(--panel)}
    .stat .k{font-size:12px;color:var(--muted);font-weight:700}.stat .v{margin-top:7px;font-size:21px;font-weight:900;letter-spacing:-.03em}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 12px}.toolbar-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}.sort-tabs{display:flex;align-items:center;gap:6px;padding:4px;border:1px solid var(--line);border-radius:12px;background:#0e121b}.sort-btn{height:34px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:#8390a5;font-size:12px;font-weight:850;cursor:pointer;white-space:nowrap}.sort-btn:hover{color:#dbe4f6;background:#151b27}.sort-btn.active{background:#263451;color:#fff;box-shadow:inset 0 0 0 1px #3b4f77}
    .search{position:relative;flex:1;max-width:430px}.search input{width:100%;height:42px;border-radius:11px;border:1px solid var(--line);background:#0e121b;color:#fff;padding:0 14px 0 38px;outline:none}.search input:focus{border-color:#566da8}.search:before{content:"⌕";position:absolute;left:14px;top:8px;color:#778297;font-size:20px}
    .status{font-size:12px;color:var(--muted);white-space:nowrap}.status strong{color:#b9c7e4}
    .table-card{border:1px solid var(--line);border-radius:18px;background:var(--panel);overflow:hidden}
    table{width:100%;border-collapse:collapse;table-layout:fixed}
    thead th{height:48px;background:#0d1119;border-bottom:1px solid var(--line);color:#8894a8;font-size:12px;font-weight:800;text-align:left;padding:0 14px}
    th.rank,td.rank{width:76px;text-align:center} th.user,td.user{width:265px} th.up,td.up{width:112px;text-align:right} th.time,td.time{width:158px} th.link,td.link{width:126px;text-align:right}
    tbody td{padding:13px 14px;border-top:1px solid rgba(35,43,59,.72);vertical-align:middle}
    tbody tr:first-child td{border-top:0} tbody tr:hover{background:#121824}
    .rank-badge{display:inline-grid;place-items:center;min-width:36px;height:30px;padding:0 9px;border-radius:9px;background:#171e2b;color:#bcc8da;font-weight:900}
    tr[data-rank="1"] .rank-badge{color:#15100a;background:#ffd66b} tr[data-rank="2"] .rank-badge{color:#11151b;background:#cad5e4} tr[data-rank="3"] .rank-badge{color:#1c100b;background:#d89462}
    .userbox{display:flex;align-items:center;min-width:0}.avatar-link{width:38px;height:38px;border-radius:50%;margin-right:11px;flex:0 0 auto;display:grid;place-items:center;background:#222b3b;overflow:hidden;border:1px solid #303b50;transition:.15s transform,.15s border-color}.avatar-link:hover{transform:scale(1.06);border-color:#748fff}.avatar{width:100%;height:100%;object-fit:cover}.avatar-fallback{font-size:12px;font-weight:900;color:#b8c7e8}.names{min-width:0}.nick{display:block;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.id{margin-top:3px;color:#687489;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .comment{color:#d8deea;font-size:13px;line-height:1.55;word-break:break-word;white-space:pre-wrap}.comment-link{display:inline-flex;align-items:center;justify-content:center;height:32px;padding:0 10px;border:1px solid #33405a;border-radius:9px;background:#151c29;color:#cbd6ec;font-size:11px;font-weight:850;white-space:nowrap;transition:.15s}.comment-link:hover{background:#202b40;border-color:#637fb8;color:#fff}.upnum{display:inline-flex;align-items:center;justify-content:flex-end;gap:6px;color:#91a9ff;font-size:15px;font-weight:950}.upnum:before{content:"▲";font-size:10px}.time{font-size:12px;color:#717e92;white-space:nowrap}
    .cut-row td{padding:0;border:0!important;background:transparent!important}.cutline{display:flex;align-items:center;gap:12px;padding:5px 16px;color:#ff8798;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}.cutline:before,.cutline:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#e4536a)}.cutline:after{background:linear-gradient(90deg,#e4536a,transparent)}
    .empty{padding:70px 20px;text-align:center;color:#7e8a9e}.skeleton{height:64px;background:linear-gradient(90deg,#101520 25%,#151c29 37%,#101520 63%);background-size:400% 100%;animation:shimmer 1.4s infinite;border-top:1px solid rgba(35,43,59,.7)}@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
    .notice{display:none;margin:12px 0;padding:12px 14px;border:1px solid #5d3540;background:#27151a;color:#ffb8c4;border-radius:11px;font-size:13px;line-height:1.5}.notice.show{display:block}
    .foot{margin-top:14px;color:#657185;font-size:11px;text-align:center;line-height:1.65}
    @media(max-width:820px){.stats{grid-template-columns:repeat(2,1fr)}.hero{padding:22px 18px}.wrap{width:min(100% - 18px,1180px);padding-top:18px}.toolbar{align-items:stretch;flex-direction:column}.toolbar-left{align-items:stretch;flex-direction:column}.sort-tabs{width:100%}.sort-btn{flex:1}.search{max-width:none}.status{text-align:right}.table-card{overflow:auto}table{min-width:860px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="eyebrow"><span class="live-dot"></span> LIVE COMMENT RANKING</div>
      <h1>그냥서버 : 적자생존 실시간 UP 랭킹</h1>
      <p class="sub">춘봉 방송국 모집 게시글의 댓글을 실시간으로 불러와 UP 높은 순으로 정렬합니다. 프로필 아이콘을 누르면 댓글 작성자의 SOOP 방송국으로 이동합니다.</p>
      <div class="hero-actions">
        <button class="btn primary" id="refreshBtn">↻ 지금 새로고침</button>
        <a class="btn" href="https://www.sooplive.com/station/chunbongtv/post/204274449" target="_blank" rel="noopener noreferrer">SOOP 원문 보기 ↗</a>
      </div>
    </section>

    <div class="stats">
      <div class="stat"><div class="k">전체 댓글</div><div class="v" id="totalCount">-</div></div>
      <div class="stat"><div class="k">현재 1위 UP</div><div class="v" id="topUp">-</div></div>
      <div class="stat"><div class="k">100위 커트라인</div><div class="v" id="cutUp">-</div></div>
      <div class="stat"><div class="k">자동 갱신</div><div class="v">1초</div></div>
    </div>

    <div class="toolbar">
      <div class="toolbar-left">
        <div class="search"><input id="searchInput" autocomplete="off" placeholder="닉네임 · 아이디 · 댓글 검색" /></div>
        <div class="sort-tabs" role="group" aria-label="댓글 정렬">
          <button class="sort-btn active" type="button" data-sort="up">UP순</button>
          <button class="sort-btn" type="button" data-sort="newest">최신순</button>
          <button class="sort-btn" type="button" data-sort="oldest">오래된순</button>
        </div>
      </div>
      <div class="status" id="status">데이터를 불러오는 중입니다.</div>
    </div>
    <div id="notice" class="notice"></div>

    <section class="table-card">
      <table>
        <thead><tr><th class="rank">UP 순위</th><th class="user">신청자</th><th>댓글</th><th class="up">UP</th><th class="time">작성일</th><th class="link">바로가기</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="6" style="padding:0"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></td></tr></tbody>
      </table>
    </section>
    <div class="foot">본 페이지는 공개된 SOOP 게시글 정보를 보기 쉽게 정렬해 보여주는 비공식 랭킹 페이지입니다. 데이터는 SOOP 원문이 기준입니다.</div>
  </main>
<script>
(() => {
  const REFRESH_MS = 1000;
  const els = {
    tbody: document.getElementById('tbody'), total: document.getElementById('totalCount'),
    topUp: document.getElementById('topUp'), cutUp: document.getElementById('cutUp'),
    search: document.getElementById('searchInput'), status: document.getElementById('status'),
    notice: document.getElementById('notice'), refresh: document.getElementById('refreshBtn'),
    sortButtons: [...document.querySelectorAll('.sort-btn')]
  };
  let all = []; let loading = false; let sortMode = 'up';
  const fmt = new Intl.NumberFormat('ko-KR');
  const esc = s => String(s ?? '').replace(/[&<>'"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
  const station = id => `https://www.sooplive.com/station/${encodeURIComponent(id)}`;
  const profile = id => {
    const clean = String(id || '').trim();
    if (!clean) return '';
    const prefix = clean.slice(0,2).toLowerCase();
    return `https://profile.img.sooplive.co.kr/LOGO/${prefix}/${clean}/${clean}.jpg`;
  };
  const prettyDate = value => {
    if (!value) return '-';
    const raw = String(value).trim();
    const normalized = raw.replace(/\./g,'-').replace(/\s+/, 'T');
    const d = new Date(normalized);
    if (Number.isNaN(d.getTime())) return raw;
    return new Intl.DateTimeFormat('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);
  };
  const parseTime = value => Date.parse(String(value||'').replace(/\./g,'-')) || 0;
  const sortRank = list => [...list].sort((a,b) => {
    const d = Number(b.up||0)-Number(a.up||0); if (d) return d;
    const at = parseTime(a.regDate);
    const bt = parseTime(b.regDate);
    if (at !== bt) return at-bt;
    return Number(a.commentNo||0)-Number(b.commentNo||0);
  });
  const sortView = ranked => {
    if (sortMode === 'newest') return [...ranked].sort((a,b) => parseTime(b.regDate)-parseTime(a.regDate) || Number(b.commentNo||0)-Number(a.commentNo||0));
    if (sortMode === 'oldest') return [...ranked].sort((a,b) => parseTime(a.regDate)-parseTime(b.regDate) || Number(a.commentNo||0)-Number(b.commentNo||0));
    return ranked;
  };
  function render(){
    const ranked = sortRank(all).map((x,i)=>({...x,rank:i+1}));
    const q = els.search.value.trim().toLowerCase();
    const ordered = sortView(ranked);
    const view = q ? ordered.filter(x => `${x.userNick} ${x.userId} ${x.comment}`.toLowerCase().includes(q)) : ordered;
    els.total.textContent = fmt.format(ranked.length);
    els.topUp.textContent = ranked.length ? fmt.format(ranked[0].up||0) : '-';
    els.cutUp.textContent = ranked.length >= 100 ? fmt.format(ranked[99].up||0) : '-';
    if (!view.length){ els.tbody.innerHTML = `<tr><td colspan="6"><div class="empty">표시할 댓글이 없습니다.</div></td></tr>`; return; }
    let html = '';
    for (const x of view){
      if (!q && sortMode === 'up' && x.rank === 101) html += `<tr class="cut-row"><td colspan="6"><div class="cutline">100위 커트라인</div></td></tr>`;
      const image = profile(x.userId);
      const avatar = x.userId ? `<a class="avatar-link" title="${esc(x.userNick)} 방송국 열기" href="${station(x.userId)}" target="_blank" rel="noopener noreferrer"><img class="avatar" src="${image}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><span class="avatar-fallback" style="display:none">↗</span></a>` : `<span class="avatar-link"><span class="avatar-fallback">?</span></span>`;
      const commentUrl = x.commentUrl || `https://www.sooplive.com/station/chunbongtv/post/204274449${x.commentNo ? `?commentNo=${encodeURIComponent(x.commentNo)}#comment-${encodeURIComponent(x.commentNo)}` : ''}`;
      html += `<tr data-rank="${x.rank}"><td class="rank"><span class="rank-badge">${x.rank}</span></td><td class="user"><div class="userbox">${avatar}<div class="names"><span class="nick">${esc(x.userNick)}</span><div class="id">${esc(x.userId || '-')}</div></div></div></td><td class="comment">${esc(x.comment || '-')}</td><td class="up"><span class="upnum">${fmt.format(x.up||0)}</span></td><td class="time">${esc(prettyDate(x.regDate))}</td><td class="link"><a class="comment-link" href="${esc(commentUrl)}" target="_blank" rel="noopener noreferrer">신청 댓글 보기 ↗</a></td></tr>`;
    }
    els.tbody.innerHTML = html;
  }
  async function load(manual=false){
    if (loading) return; loading = true;
    if (manual) {
      els.refresh.disabled = true;
      els.refresh.textContent = '↻ 불러오는 중';
    }
    try{
      const res = await fetch(`/api/comments?t=${Date.now()}`,{cache:'no-store'});
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
      all = Array.isArray(data.comments) ? data.comments : [];
      render();
      const time = new Date(data.fetchedAt || Date.now()).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
      els.status.innerHTML = `<strong>${time}</strong> 기준 · ${manual?'수동 갱신 완료':'실시간 자동 갱신 중'}`;
      els.notice.classList.remove('show'); els.notice.textContent='';
    }catch(e){
      els.status.textContent='최근 데이터 갱신 실패';
      els.notice.textContent = `SOOP 데이터를 불러오지 못했습니다. 잠시 후 자동으로 다시 시도합니다. (${e.message})`;
      els.notice.classList.add('show');
      if (!all.length) els.tbody.innerHTML = `<tr><td colspan="6"><div class="empty">댓글 데이터를 불러오지 못했습니다.</div></td></tr>`;
    }finally{
      loading=false;
      if (manual) {
        els.refresh.disabled=false;
        els.refresh.textContent='↻ 지금 새로고침';
      }
    }
  }
  els.search.addEventListener('input',render);
  els.sortButtons.forEach(btn => btn.addEventListener('click', () => {
    sortMode = btn.dataset.sort || 'up';
    els.sortButtons.forEach(x => x.classList.toggle('active', x === btn));
    render();
  }));
  els.refresh.addEventListener('click',()=>load(true));
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load(false); });
  load(false);
  setInterval(()=>{ if (!document.hidden) load(false); }, REFRESH_MS);
})();
</script>
</body>
</html>
